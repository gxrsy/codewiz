<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: relative;
        }

        /* Container to center and handle the background image scaling */
        .bg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .fullscreen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transform: scale(1.15); 
            display: block;
            filter: brightness(0.5); 
        }

        /* Top-left search bar overlay */
        .search-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .search-bar {
            width: 250px;
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* Made it a sharp rectangle by removing the border-radius */
            border-radius: 0px; 
            /* Grey and slightly transparent background */
            background-color: rgba(128, 128, 128, 0.4); 
            color: #ffffff;
            outline: none;
            transition: background-color 0.3s ease;
        }

        /* Subtle glow effect when clicking into the search bar */
        .search-bar:focus {
            background-color: rgba(150, 150, 150, 0.6);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Styling for the placeholder text color */
        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" class="search-bar" placeholder="search games...">
    </div>

    <div class="bg-container">
        <img src="back.png" alt="Background Image" class="fullscreen-bg">
    </div>

</body>
</html>
