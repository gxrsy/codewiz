<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: relative;
            font-family: Arial, sans-serif;
            /* Prevents users from selecting text/elements accidentally */
            user-select: none; 
        }

        /* Background Image Setup */
        .bg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .fullscreen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transform: scale(1.15); 
            display: block;
            filter: brightness(0.5); 
            /* Disable native browser image dragging */
            pointer-events: none; 
        }

        /* Top-left search bar */
        .search-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .search-bar {
            width: 250px;
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0px; 
            background-color: rgba(128, 128, 128, 0.4); 
            color: #ffffff;
            outline: none;
            transition: background-color 0.3s ease;
        }

        .search-bar:focus {
            background-color: rgba(150, 150, 150, 0.6);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Top-right UI when logged in */
        .auth-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: rgba(128, 128, 128, 0.4);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: rgba(150, 150, 150, 0.6);
        }

        .hidden {
            display: none !important;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: rgba(128, 128, 128, 0.4);
            padding: 5px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Centered Rectangle Login Box */
        .login-box-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background-color: rgba(40, 40, 40, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0px 4px 25px rgba(0,0,0,0.7);
        }

        .login-box-center input {
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            outline: none;
            font-size: 14px;
        }

        /* Bottom sign up footer inside the center box */
        .signup-footer {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .signup-link {
            color: #4da6ff;
            text-decoration: none;
            cursor: pointer;
            margin-left: 5px;
        }

        .signup-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" class="search-bar" placeholder="search games...">
    </div>

    <div class="auth-container">
        <div id="userProfile" class="user-profile hidden">
            <span id="welcomeText">Hi, User</span>
            <button class="btn" style="padding: 5px 10px; font-size: 14px;" onclick="handleSignOut()">Sign Out</button>
        </div>
    </div>

    <div id="loginBox" class="login-box-center">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="btn" onclick="handleLogin()">Login</button>
        
        <div class="signup-footer">
            don't have an account?<span class="signup-link" onclick="handleSignUpRedirect()">sign up</span>
        </div>
    </div>

    <div class="bg-container">
        <img src="back.png" alt="Background Image" class="fullscreen-bg" draggable="false">
    </div>

    <script>
        window.onload = function() {
            const savedUser = localStorage.getItem("loggedInUser");
            if (savedUser) {
                showLoggedInState(savedUser);
            }
        };

        function handleLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();

            if (user && pass) {
                localStorage.setItem("loggedInUser", user);
                showLoggedInState(user);
                
                // Clear fields
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
            } else {
                alert("Please fill out both fields.");
            }
        }

        function handleSignOut() {
            localStorage.removeItem("loggedInUser");
            document.getElementById("userProfile").classList.add("hidden");
            document.getElementById("loginBox").classList.remove("hidden");
        }

        function showLoggedInState(username) {
            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("userProfile").classList.remove("hidden");
            document.getElementById("welcomeText").innerText = username;
        }

        function handleSignUpRedirect() {
            alert("Redirecting to sign up process...");
            // You can replace this alert with a window.location.href to link to a registration page later
        }
    </script>
</body>
</html>
