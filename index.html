<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullscreen-bg {
            width: 100%;
            height: 100%;
            /* Changed to 'cover' and zoomed in slightly to crop out the built-in borders */
            object-fit: cover; 
            transform: scale(1.15); 
            display: block;
            
            /* Keeps your brightness setting */
            filter: brightness(0.5); 
        }
    </style>
</head>
<body>

    <img src="back.png" alt="Background Image" class="fullscreen-bg">

</body>
</html>
