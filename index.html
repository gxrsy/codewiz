<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: relative;
            font-family: Arial, sans-serif;
        }

        /* Background Image Setup */
        .bg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .fullscreen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transform: scale(1.15); 
            display: block;
            filter: brightness(0.5); 
        }

        /* Top-left search bar */
        .search-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .search-bar {
            width: 250px;
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0px; 
            background-color: rgba(128, 128, 128, 0.4); 
            color: #ffffff;
            outline: none;
            transition: background-color 0.3s ease;
        }

        .search-bar:focus {
            background-color: rgba(150, 150, 150, 0.6);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Top-right Sign In / Account UI */
        .auth-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: rgba(128, 128, 128, 0.4);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: rgba(150, 150, 150, 0.6);
        }

        /* Hidden class for toggling states */
        .hidden {
            display: none !important;
        }

        /* Sign-In Dropdown Form */
        .login-box {
            position: absolute;
            top: 45px;
            right: 0;
            background-color: rgba(40, 40, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }

        .login-box input {
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            outline: none;
        }

        /* User Profile View (When logged in) */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: rgba(128, 128, 128, 0.4);
            padding: 5px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" class="search-bar" placeholder="search games...">
    </div>

    <div class="auth-container">
        <button id="signInBtn" class="btn" onclick="toggleLoginBox()">Sign In</button>

        <div id="loginBox" class="login-box hidden">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="handleLogin()">Login</button>
        </div>

        <div id="userProfile" class="user-profile hidden">
            <span id="welcomeText">Hi, User</span>
            <button class="btn" style="padding: 5px 10px; font-size: 14px;" onclick="handleSignOut()">Sign Out</button>
        </div>
    </div>

    <div class="bg-container">
        <img src="back.png" alt="Background Image" class="fullscreen-bg">
    </div>

    <script>
        // Check local storage immediately when the page loads to see if they are logged in
        window.onload = function() {
            const savedUser = localStorage.getItem("loggedInUser");
            if (savedUser) {
                showLoggedInState(savedUser);
            }
        };

        // Open/close the login inputs dropdown
        function toggleLoginBox() {
            const loginBox = document.getElementById("loginBox");
            loginBox.classList.toggle("hidden");
        }

        // Action when user clicks Login
        function handleLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();

            if (user && pass) {
                // Save login status to browser storage (stays until explicitly cleared)
                localStorage.setItem("loggedInUser", user);
                
                showLoggedInState(user);
                
                // Clear fields and hide box
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
                document.getElementById("loginBox").classList.add("hidden");
            } else {
                alert("Please fill out both fields.");
            }
        }

        // Action when user clicks Sign Out
        function handleSignOut() {
            // Remove the login cookie/token from browser storage
            localStorage.removeItem("loggedInUser");
            
            // Switch back UI elements
            document.getElementById("userProfile").classList.add("hidden");
            document.getElementById("signInBtn").classList.remove("hidden");
        }

        // Helper to adjust the UI elements
        function showLoggedInState(username) {
            document.getElementById("signInBtn").classList.add("hidden");
            document.getElementById("userProfile").classList.remove("hidden");
            document.getElementById("welcomeText").innerText = username;
        }
    </script>
</body>
</html>
