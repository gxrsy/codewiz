<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        /* Remove default margins and padding */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars */
            background-color: #000; /* Fallback color */
        }

        /* Make the image cover the entire screen */
        .fullscreen-bg {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Stretches/crops the image to fit without distortion */
            display: block;
        }
    </style>
</head>
<body>

    <img src="back.png" alt="Background Image" class="fullscreen-bg">

</body>
</html>
