<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisp Blocks - AI Scratch Studio</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500/30">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Visual code action definitions
        const SCRATCH_PALETTE = [
            { id: "b1", type: "motion", text: "🐱 when game starts loop forever", color: "bg-amber-500" },
            { id: "b2", type: "motion", text: "🏃 move sprite forward 10 steps", color: "bg-blue-500" },
            { id: "b3", type: "motion", text: "🔄 turn clockwise 15 degrees", color: "bg-blue-600" },
            { id: "b4", type: "looks", text: "🎨 change background color to random", color: "bg-purple-500" },
            { id: "b5", type: "sound", text: "🎵 play electronic synth blast", color: "bg-fuchsia-500" },
            { id: "b6", type: "control", text: "⏱️ wait 1 second before repeat", color: "bg-orange-500" }
        ];

        const AI_TIERS = [
            { id: 'low', name: 'Llama 3.2 (Free Tier)', tier: 'LOW', reqPremium: false, idStr: 'meta-llama/llama-3.2-3b-instruct:free' },
            { id: 'mid', name: 'Laguna M.1 (Pro Coding)', tier: 'MID', reqPremium: true, idStr: 'poolside/laguna-m.1:free' },
            { id: 'high', name: 'Nemotron Ultra (Orchestration)', tier: 'HIGH', reqPremium: true, idStr: 'nvidia/nemotron-3-ultra-550b-a55b:free' }
        ];

        function Icon({ name, size = 16, className = "" }) {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        }

        function App() {
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('wisp_user')) || null);
            const [currentPage, setCurrentPage] = useState(user ? '/' : '/login');
            const [apiKey, setApiKey] = useState('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');
            
            const [games, setGames] = useState(() => {
                const saved = localStorage.getItem('wisp_games');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: "Cyber Dodge Block", creator: "NinjaDev", blocks: ["b1", "b2"], thumbnail: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=200" },
                    { id: 2, title: "Synth Rhythm Clicker", creator: "PixelArtiste", blocks: ["b1", "b4", "b5"], thumbnail: "https://images.unsplash.com/photo-1529699211952-734e80c4d42b?q=80&w=200" }
                ];
            });

            // Persist systems changes
            useEffect(() => { localStorage.setItem('wisp_games', JSON.stringify(games)); }, [games]);
            useEffect(() => { localStorage.setItem('wisp_api_key', apiKey); }, [apiKey]);

            const handleLogout = () => {
                localStorage.removeItem('wisp_user');
                setUser(null);
                setCurrentPage('/login');
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between font-sans">
                    <nav className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => user && setCurrentPage('/')}>
                            <div className="p-2 bg-amber-500 rounded-xl text-slate-950 flex items-center justify-center font-bold">
                                <Icon name="layout-grid" size={20} />
                            </div>
                            <span className="font-black text-lg tracking-tight">WISP<span className="text-amber-500">BLOCKS</span></span>
                        </div>

                        {user && (
                            <div className="flex flex-wrap items-center gap-4 w-full sm:w-auto justify-end text-xs">
                                <div className="flex items-center bg-slate-950 border border-slate-800 rounded-lg px-2 py-1">
                                    <Icon name="key" size={12} className="text-slate-500 mr-2" />
                                    <input 
                                        type="password" 
                                        placeholder="Paste OpenRouter Key Here" 
                                        value={apiKey} 
                                        onChange={(e) => setApiKey(e.target.value)}
                                        className="bg-transparent focus:outline-none w-36 text-slate-300"
                                    />
                                </div>
                                <button onClick={() => setCurrentPage('/')} className="hover:text-amber-500 font-bold transition">Browse</button>
                                <button onClick={() => setCurrentPage('/editor')} className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-lg font-bold transition flex items-center gap-1">
                                    <Icon name="plus" size={14} /> Create Studio
                                </button>
                                <div className="flex items-center bg-slate-800 rounded-lg px-3 py-1.5 border border-slate-700">
                                    <span className="font-mono text-slate-400 mr-2 uppercase tracking-wide text-[10px]">{user.plan}</span>
                                    <span className="font-bold text-white">{user.username}</span>
                                </div>
                                <button onClick={handleLogout} className="text-slate-400 hover:text-red-400"><Icon name="log-out" size={16} /></button>
                            </div>
                        )}
                    </nav>

                    <main className="p-6 flex-1 max-w-7xl w-full mx-auto">
                        {currentPage === '/login' && <AuthPage setUser={setUser} setCurrentPage={setCurrentPage} />}
                        {user && currentPage === '/' && <FeedPage games={games} setCurrentPage={setCurrentPage} />}
                        {user && currentPage === '/editor' && <EditorPage games={games} setGames={setGames} user={user} apiKey={apiKey} />}
                    </main>

                    <footer className="py-4 text-center text-xs text-slate-600 bg-slate-900/50 border-t border-slate-900">
                        Scratch Engine Model Array Layout • Plan Limitations Active
                    </footer>
                </div>
            );
        }

        // ==========================================
        // 1. SIMPLIFIED SIGNUP / LOGIN GATE
        // ==========================================
        function AuthPage({ setUser, setCurrentPage }) {
            const [isSignup, setIsSignup] = useState(true);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [plan, setPlan] = useState('free');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!username.trim() || !password.trim()) return;
                
                const payload = { username, plan };
                localStorage.setItem('wisp_user', JSON.stringify(payload));
                setUser(payload);
                setCurrentPage('/');
            };

            return (
                <div className="max-w-md mx-auto my-12 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6 animate-fadeIn">
                    <div className="text-center space-y-1">
                        <h2 className="text-xl font-black text-white">{isSignup ? 'Create Account' : 'Sign In'}</h2>
                        <p className="text-xs text-slate-400">You must have an account node to save games and access workspace canvases.</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                        <div>
                            <label className="block text-slate-400 font-bold mb-1">Username</label>
                            <input type="text" required placeholder="Pick a nickname" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500" />
                        </div>
                        <div>
                            <label className="block text-slate-400 font-bold mb-1">Password</label>
                            <input type="password" required placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-500" />
                        </div>
                        {isSignup && (
                            <div>
                                <label className="block text-slate-400 font-bold mb-1">Tier Tier Plan Selection</label>
                                <select value={plan} onChange={(e) => setPlan(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none">
                                    <option value="free">Standard Free Plan (LOW Tier AI Only)</option>
                                    <option value="premium">Premium Pro Dev (Unlock All Tiers)</option>
                                </select>
                            </div>
                        )}
                        <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 py-2.5 rounded-lg text-xs font-bold transition uppercase tracking-wider">
                            {isSignup ? 'Register New Space' : 'Connect Profile Engine'}
                        </button>
                    </form>

                    <button onClick={() => setIsSignup(!isSignup)} className="w-full text-center text-[11px] text-slate-400 hover:text-amber-500 transition">
                        {isSignup ? 'Already have an account? Log in' : 'Need an account? Sign up here'}
                    </button>
                </div>
            );
        }

        // ==========================================
        // 2. DISCOVERY BROWSE FEED (`/`)
        // ==========================================
        function FeedPage({ games }) {
            return (
                <div className="space-y-6 animate-fadeIn">
                    <div className="border-b border-slate-900 pb-4">
                        <h2 className="text-lg font-black text-white flex items-center gap-2">
                            <Icon name="globe" size={18} className="text-amber-500" /> Community Scratch Pipeline Feed
                        </h2>
                        <p className="text-xs text-slate-400 mt-1">Explore custom block sequences generated by platform accounts.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {games.map(game => (
                            <div key={game.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-4">
                                <div className="space-y-3">
                                    <img src={game.thumbnail} className="w-full h-28 object-cover rounded-lg bg-slate-950" />
                                    <div>
                                        <h3 className="font-bold text-sm text-white">{game.title}</h3>
                                        <span className="text-[10px] text-slate-500">By {game.creator}</span>
                                    </div>
                                    <div className="flex flex-wrap gap-1">
                                        {game.blocks.map((bId, i) => {
                                            const match = SCRATCH_PALETTE.find(p => p.id === bId);
                                            return match ? (
                                                <span key={i} className={`text-[8px] font-bold px-1.5 py-0.5 rounded text-white ${match.color}`}>
                                                    {match.text.split(' ')[0]}
                                                </span>
                                            ) : null;
                                        })}
                                    </div>
                                </div>
                                <button onClick={() => alert(`Running code payload string array: ${JSON.stringify(game.blocks)}`)} className="w-full bg-slate-950 border border-slate-800 hover:bg-slate-800 text-slate-300 py-1.5 rounded text-xs transition">
                                    Run Block Architecture
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 3. SCRATCH WORKSPACE & LOCKED MODEL ENGINE
        // ==========================================
        function EditorPage({ games, setGames, user, apiKey }) {
            const [title, setTitle] = useState('New Code Matrix Block');
            const [selectedBlocks, setSelectedBlocks] = useState([]);
            const [currentModel, setCurrentModel] = useState(AI_TIERS[0]);
            const [aiSuggestion, setAiSuggestion] = useState('');
            const [loading, setLoading] = useState(false);

            const addBlock = (id) => { setSelectedBlocks([...selectedBlocks, id]); };
            const clearBlocks = () => { setSelectedBlocks([]); };

            const handleModelSelect = (model) => {
                if (model.reqPremium && user.plan !== 'premium') {
                    alert(`🚨 Locked Access Node! The ${model.tier} Tier model requires a Premium Plan. Your free account is locked to the LOW Tier model.`);
                    return;
                }
                setCurrentModel(model);
            };

            const queryAiAssistance = async () => {
                if (!apiKey) {
                    alert("Please insert an active OpenRouter API Key in the upper control navigation field bar first.");
                    return;
                }
                setLoading(true);
                setAiSuggestion('Querying plan authorization arrays...');

                const blockDescriptions = selectedBlocks.map(id => SCRATCH_PALETTE.find(p => p.id === id)?.text).join(', ');
                
                try {
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: currentModel.idStr,
                            messages: [
                                { role: "system", content: "You are a friendly Scratch programming assistant. Give a short, 2-sentence piece of feedback on the blocks provided." },
                                { role: "user", content: `My Scratch block configuration stack contains: ${blockDescriptions || 'No blocks yet'}` }
                            ]
                        })
                    });
                    const data = await response.json();
                    setAiSuggestion(data.choices?.[0]?.message?.content || 'Pipeline parsing error node.');
                } catch (err) {
                    setAiSuggestion('手 Connection Failure. Check key strings or rotation tier allocations.');
                } finally {
                    setLoading(false);
                }
            };

            const saveAndPublish = () => {
                if (selectedBlocks.length === 0) return alert("Add blocks to your layout space before publishing.");
                const record = {
                    id: Date.now(),
                    title,
                    creator: user.username,
                    blocks: selectedBlocks,
                    thumbnail: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=200"
                };
                setGames([record, ...games]);
                alert("Game pushed successfully onto LocalStorage and Platform Feed Arrays!");
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[500px] animate-fadeIn text-xs">
                    
                    {/* PALETTE COMPONENT BLOCK COLUMN (4 COLS) */}
                    <div className="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-4">
                        <div className="font-bold text-white uppercase tracking-wider text-[10px] text-slate-400">Scratch Block Palette</div>
                        <div className="space-y-2">
                            {SCRATCH_PALETTE.map(block => (
                                <button key={block.id} onClick={() => addBlock(block.id)} className={`w-full text-left p-2.5 rounded-lg text-white font-bold transition hover:scale-[1.01] ${block.color} flex items-center justify-between`}>
                                    <span>{block.text}</span>
                                    <Icon name="plus" size={12} />
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* LIVE EDITING DRAW SPACE (4 COLS) */}
                    <div className="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                        <div className="space-y-4">
                            <div className="flex justify-between items-center">
                                <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} className="bg-slate-950 border border-slate-800 text-white font-bold p-1 px-2 rounded focus:outline-none" />
                                <button onClick={clearBlocks} className="text-slate-500 hover:text-slate-300">Clear</button>
                            </div>

                            <div className="bg-slate-950 rounded-xl p-4 min-h-[300px] border border-slate-800 space-y-2">
                                {selectedBlocks.length === 0 ? (
                                    <div className="text-center text-slate-600 mt-12">Click blocks on the left to stack code paths together.</div>
                                ) : (
                                    selectedBlocks.map((bId, idx) => {
                                        const match = SCRATCH_PALETTE.find(p => p.id === bId);
                                        return (
                                            <div key={idx} className={`p-2 rounded text-white font-bold ${match?.color} shadow-sm animate-fadeIn`}>
                                                {match?.text}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        <button onClick={saveAndPublish} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg font-bold uppercase transition">
                            Save & Publish Build Node
                        </button>
                    </div>

                    {/* AI ASSISTANT PLAN CONSTRAINT ENGINE (4 COLS) */}
                    <div className="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-4">
                        <div className="space-y-4">
                            <div>
                                <div className="font-bold text-white uppercase tracking-wider text-[10px] text-slate-400 mb-2">OpenRouter Model Tiers</div>
                                <div className="space-y-1.5">
                                    {AI_TIERS.map(m => (
                                        <button key={m.id} onClick={() => handleModelSelect(m)} className={`w-full p-2 rounded-lg border text-left flex justify-between items-center transition ${currentModel.id === m.id ? 'border-amber-500 bg-amber-500/10 text-white' : 'border-slate-800 bg-slate-950/40 text-slate-400'}`}>
                                            <span>{m.name}</span>
                                            {m.reqPremium && <span className="text-[9px] bg-red-500/20 text-red-400 px-1.5 py-0.2 rounded uppercase font-bold tracking-wide">Locked</span>}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 min-h-[160px] flex flex-col justify-between">
                                <div className="text-slate-400 italic leading-relaxed text-[11px]">
                                    {aiSuggestion || "Stack blocks together and click below to request AI architecture reviews."}
                                </div>
                                <div className="text-[9px] text-slate-600 font-mono mt-2 border-t border-slate-900 pt-2">
                                    Target Model: {currentModel.idStr}
                                </div>
                            </div>
                        </div>

                        <button onClick={queryAiAssistance} disabled={loading} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg font-bold uppercase transition flex items-center justify-center gap-1">
                            <Icon name="sparkles" size={12} /> {loading ? 'Computing Analysis...' : 'Request AI Block Review'}
                        </button>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
