<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Black background fills any empty space around the zoomed-out image */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullscreen-bg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Zooms out to fit the full image on screen */
            display: block;
            
            /* Makes the image darker (0.5 = 50% brightness) */
            filter: brightness(0.5); 
        }
    </style>
</head>
<body>

    <img src="back.png" alt="Background Image" class="fullscreen-bg">

</body>
</html>
