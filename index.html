<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisp Studio - AI HTML5 Game Engine</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500/30">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // CONFIGURATIONS & INITIAL SEED DATA
        // ==========================================
        const INITIAL_GAMES = [
            { id: 1, title: "Neon Cyber Runner", creator: "AlexVortex", htmlSource: "<h1>Cyber Runner</h1><p>Static Preview Mode</p>", thumbnail: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400", tags: ["Action", "Sci-Fi"] },
            { id: 2, title: "Quantum Retro Brick", creator: "PixelKnight", htmlSource: "<h1>Brick Breaker</h1><p>Static Preview Mode</p>", thumbnail: "https://images.unsplash.com/photo-1612287230202-1bf1d85d1bdf?q=80&w=400", tags: ["Retro", "Arcade"] },
        ];

        const AI_TIERS = [
            { id: 'low', name: 'Llama 3.2 3B (Free Tier)', tier: 'LOW', reqPremium: false, idStr: 'meta-llama/llama-3.2-3b-instruct:free', desc: 'Fast, lightweight logic parsing.' },
            { id: 'mid', name: 'Laguna M.1 (Pro Coding)', tier: 'MID', reqPremium: true, idStr: 'poolside/laguna-m.1:free', desc: 'Balanced structural orchestration.' },
            { id: 'high', name: 'Nemotron Ultra (Flagship)', tier: 'HIGH', reqPremium: true, idStr: 'nvidia/nemotron-3-ultra-550b-a55b:free', desc: 'Intense state tracking loops.' }
        ];

        // Helper component to easily inject Lucide icons in standalone mode
        function Icon({ name, size = 16, className = "" }) {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        }

        // ==========================================
        // ROOT PLATFORM APPLICATION
        // ==========================================
        function App() {
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('wisp_user')) || null);
            const [currentPage, setCurrentPage] = useState(user ? '/' : '/login');
            const [games, setGames] = useState(() => {
                const saved = localStorage.getItem('wisp_games');
                return saved ? JSON.parse(saved) : INITIAL_GAMES;
            });

            // ----------------------------------------------------------------------
            // ⚠️ HARDCODE YOUR OPENROUTER API KEY IN THE STRING HOOK BELOW
            // ----------------------------------------------------------------------
            const [apiKey] = useState('YOUR_OPENROUTER_API_KEY_HERE');

            // Shared Workspace States to survive page swaps
            const [htmlSource, setHtmlSource] = useState(`<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .ball { width: 50px; height: 50px; background: #f59e0b; border-radius: 50%; margin: 20px auto; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-30px); } }
    </style>
</head>
<body>
    <h3>AI Sandbox Engine Active</h3>
    <div class="ball"></div>
    <p>Tell the AI on the left to change this game!</p>
</body>
</html>`);
            const [chatHistory, setChatHistory] = useState([
                { role: 'assistant', text: "Hey! I am your AI game developer. Tell me what kind of HTML5/JavaScript game you want to build. I will compile the entire app live on the right!" }
            ]);

            useEffect(() => { localStorage.setItem('wisp_games', JSON.stringify(games)); }, [games]);

            const handleLogout = () => {
                localStorage.removeItem('wisp_user');
                setUser(null);
                setCurrentPage('/login');
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between font-sans">
                    
                    {/* GLOBAL TOP NAVIGATION HEADER */}
                    <nav className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 shrink-0">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => user && setCurrentPage('/')}>
                            <div className="p-2 bg-indigo-600 rounded-xl text-white flex items-center justify-center font-bold">
                                <Icon name="terminal" size={20} />
                            </div>
                            <span className="font-black text-xl tracking-tight">WISP<span className="text-indigo-500">.STUDIO</span></span>
                        </div>

                        {user && (
                            <div className="flex items-center gap-5 text-xs">
                                <button onClick={() => setCurrentPage('/')} className="hover:text-indigo-400 font-bold transition">Browse Games</button>
                                <button onClick={() => setCurrentPage('/editor')} className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-bold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/10">
                                    <Icon name="sparkles" size={14} /> Creation Workspace
                                </button>
                                <div className="flex items-center bg-slate-800 rounded-lg px-3 py-1.5 border border-slate-700">
                                    <span className="font-mono text-slate-400 mr-2 uppercase tracking-wide text-[9px] font-bold bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">{user.plan}</span>
                                    <span className="font-bold text-slate-200">{user.username}</span>
                                </div>
                                <button onClick={handleLogout} className="text-slate-400 hover:text-red-400 transition flex items-center"><Icon name="log-out" size={16} /></button>
                            </div>
                        )}
                    </nav>

                    {/* ROUTER CONTENT BODY MODULE */}
                    <main className="flex-1 w-full flex flex-col overflow-hidden">
                        {currentPage === '/login' && <AuthPage setUser={setUser} setCurrentPage={setCurrentPage} />}
                        {user && currentPage === '/' && <FeedPage games={games} setCurrentPage={setCurrentPage} />}
                        {user && currentPage === '/editor' && (
                            <EditorPage 
                                htmlSource={htmlSource} 
                                setHtmlSource={setHtmlSource} 
                                chatHistory={chatHistory} 
                                setChatHistory={setChatHistory} 
                                games={games} 
                                setGames={setGames} 
                                user={user} 
                                apiKey={apiKey} 
                            />
                        )}
                    </main>

                    {/* STATE METRICS SYSTEM FOOTER */}
                    <footer className="py-2.5 text-center text-[11px] text-slate-600 bg-slate-900 border-t border-slate-900 font-mono tracking-wider shrink-0">
                        WISP ENGINE MATRIX DEPLOYMENT CORE • ALL SYSTEM TIERS LOADED
                    </footer>
                </div>
            );
        }

        // ==========================================
        // 1. ACCOUNT COMPONENT IDENTITY NODE (`/login`)
        // ==========================================
        function AuthPage({ setUser, setCurrentPage }) {
            const [isSignup, setIsSignup] = useState(true);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [plan, setPlan] = useState('free');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!username.trim() || !password.trim()) return;
                const payload = { username, plan };
                localStorage.setItem('wisp_user', JSON.stringify(payload));
                setUser(payload);
                setCurrentPage('/');
            };

            return (
                <div className="max-w-md mx-auto my-16 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6 animate-fadeIn text-xs">
                    <div className="text-center space-y-1">
                        <div className="inline-flex p-2.5 bg-indigo-500/10 text-indigo-400 rounded-xl mb-1"><Icon name="key" size={20} /></div>
                        <h2 className="text-lg font-black text-white tracking-tight">{isSignup ? 'Create Developer Identity' : 'Authenticate Security Core'}</h2>
                        <p className="text-slate-400">An active account allocation node is required to build and save code workspaces.</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-slate-400 font-bold mb-1.5 uppercase tracking-wider text-[10px]">Username Identity Handle</label>
                            <input type="text" required placeholder="e.g., CyberWeaver" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 transition" />
                        </div>
                        <div>
                            <label className="block text-slate-400 font-bold mb-1.5 uppercase tracking-wider text-[10px]">Access Key Password</label>
                            <input type="password" required placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 transition" />
                        </div>
                        {isSignup && (
                            <div>
                                <label className="block text-slate-400 font-bold mb-1.5 uppercase tracking-wider text-[10px]">Development Tier Profile Assignment</label>
                                <select value={plan} onChange={(e) => setPlan(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 transition font-medium">
                                    <option value="free">Standard Free Account (LOW Tier AI Only)</option>
                                    <option value="premium">Premium Pro Dev (All Tier Tiers Unlocked)</option>
                                </select>
                            </div>
                        )}
                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg font-bold transition uppercase tracking-wider shadow-lg">
                            {isSignup ? 'PROVISION IDENTITY NODE' : 'INITIALIZE SYSTEM INTERFACE'}
                        </button>
                    </form>

                    <button onClick={() => setIsSignup(!isSignup)} className="w-full text-center text-slate-400 hover:text-indigo-400 transition font-medium">
                        {isSignup ? 'Already registered? Sync access profile logs' : 'Need development credentials? Spawn an account profile'}
                    </button>
                </div>
            );
        }

        // ==========================================
        // 2. MAIN BROWSE DISCOVERY HUB PAGE (`/`)
        // ==========================================
        function FeedPage({ games }) {
            return (
                <div className="p-6 space-y-6 animate-fadeIn max-w-7xl w-full mx-auto">
                    <div className="border-b border-slate-900 pb-4">
                        <h2 className="text-base font-black text-white flex items-center gap-2">
                            <Icon name="globe" size={16} className="text-indigo-400" /> Active Platform Engine Builds
                        </h2>
                        <p className="text-xs text-slate-400 mt-1">Explore custom single-file HTML applications generated directly by user accounts.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {games.map(game => (
                            <div key={game.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-4 hover:border-slate-700 transition">
                                <div className="space-y-3">
                                    <img src={game.thumbnail} className="w-full h-32 object-cover rounded-lg bg-slate-950 border border-slate-800" />
                                    <div>
                                        <h3 className="font-bold text-sm text-white tracking-tight">{game.title}</h3>
                                        <span className="text-[10px] text-slate-500 font-medium">Compiled by: {game.creator}</span>
                                    </div>
                                    <div className="flex flex-wrap gap-1">
                                        {game.tags.map((t, i) => (
                                            <span key={i} className="text-[9px] font-mono px-2 py-0.5 bg-slate-950 border border-slate-800 text-slate-400 rounded uppercase tracking-wider">
                                                {t}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={() => alert(`Launching sandbox instance environment for node id: ${game.id}`)} className="w-full bg-slate-950 border border-slate-800 hover:bg-indigo-600 hover:border-indigo-500 text-slate-300 hover:text-white py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5">
                                    <Icon name="play" size={12} /> EXECUTE DYNAMIC CONTAINER
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 3. THE SPLIT-SCREEN WORKSPACE ENGINE SYSTEM (`/editor`)
        // ==========================================
        function EditorPage({ htmlSource, setHtmlSource, chatHistory, setChatHistory, games, setGames, user, apiKey }) {
            const [activeTab, setActiveTab] = useState('preview'); // 'preview' | 'source'
            const [currentModel, setCurrentModel] = useState(AI_TIERS[0]);
            const [promptInput, setPromptInput] = useState('');
            const [isCompiling, setIsCompiling] = useState(false);
            const [buildTitle, setBuildTitle] = useState('My AI Scaffold Application');
            const iframeRef = useRef(null);

            // Dynamically flush internal iframe canvas container when code modifications hit hooks
            useEffect(() => {
                if (activeTab === 'preview' && iframeRef.current) {
                    const doc = iframeRef.current.contentDocument || iframeRef.current.contentWindow.document;
                    doc.open();
                    doc.write(htmlSource);
                    doc.close();
                }
            }, [htmlSource, activeTab]);

            const handleModelChange = (model) => {
                if (model.reqPremium && user.plan !== 'premium') {
                    alert(`🚨 Locked Access Node Configuration! The ${model.tier} Tier processing layer is reserved for premium subscribers. Your current account profile is limited strictly to the LOW Tier.`);
                    return;
                }
                setCurrentModel(model);
            };

            const executeTextingEngine = async (e) => {
                e.preventDefault();
                if (!promptInput.trim()) return;
                
                if (apiKey === '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' || !apiKey) {
                    alert("Handshake Failure: Please update the hardcoded apiKey variable context located inside the <script> block with a real OpenRouter API Key.");
                    return;
                }

                const userText = promptInput;
                setChatHistory(prev => [...prev, { role: 'user', text: userText }]);
                setPromptInput('');
                setIsCompiling(true);

                try {
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: currentModel.idStr,
                            messages: [
                                { 
                                    role: "system", 
                                    content: "You are a master game engine web developer. Output a complete, single-file functional HTML game containing inline modern styling and standard JavaScript/HTML canvas controls based on the request. Do not include markdown code block syntax (like ```html), explanations, or notes. Output ONLY raw clean valid HTML." 
                                },
                                { role: "user", content: `Here is the current source code framework:\n${htmlSource}\n\nUpdate it with this request: ${userText}` }
                            ]
                        })
                    });

                    const data = await response.json();
                    let rawContent = data.choices?.[0]?.message?.content || "";
                    
                    // Clean out standard markdown wrapper overrides if the model forcefully spits them out
                    rawContent = rawContent.replace(/^```html\n/, '').replace(/\n```$/, '').trim();

                    if (rawContent) {
                        setHtmlSource(rawContent);
                        setChatHistory(prev => [...prev, { role: 'assistant', text: "Framework compilation complete. Check the live interactive grid space to preview or export code paths." }]);
                    } else {
                        throw new Error("Empty return payload node.");
                    }
                } catch (err) {
                    setChatHistory(prev => [...prev, { role: 'assistant', text: "Critical routing handshake error. Validate key configurations or active model states." }]);
                } finally {
                    setIsCompiling(false);
                }
            };

            const commitProjectPublish = () => {
                const build = {
                    id: Date.now(),
                    title: buildTitle,
                    creator: user.username,
                    htmlSource: htmlSource,
                    thumbnail: "[https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400](https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400)",
                    tags: ["AI-Native", "HTML5"]
                };
                setGames([build, ...games]);
                alert(`Success! "${buildTitle}" has been safely registered to LocalStorage array channels and the Browse Game feed.`);
            };

            return (
                <div className="flex-1 w-full grid grid-cols-1 lg:grid-cols-12 overflow-hidden bg-slate-950 p-4 gap-4 max-h-[calc(100vh-120px)]">
                    
                    {/* LEFT SIDE PANEL: AI TEXTING CHAT CONSOLE (5 COLS) */}
                    <div className="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-xl flex flex-col justify-between overflow-hidden shadow-xl">
                        
                        {/* TIER ARRAY TABS HEADER */}
                        <div className="p-3 bg-slate-950/60 border-b border-slate-800 space-y-2">
                            <div className="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-slate-400">
                                <span className="flex items-center gap-1"><Icon name="layers" size={12} className="text-indigo-400" /> Model Processing Plan Array</span>
                                <span className="text-emerald-400 font-mono">100% Free Tiers</span>
                            </div>
                            <div className="grid grid-cols-3 gap-1.5 text-[10px] font-bold">
                                {AI_TIERS.map(tier => (
                                    <button 
                                        key={tier.id} 
                                        onClick={() => handleModelChange(tier)}
                                        className={`p-1.5 rounded border text-left flex flex-col justify-between transition ${currentModel.id === tier.id ? 'border-indigo-500 bg-indigo-500/10 text-white' : 'border-slate-800 bg-slate-900/40 text-slate-400'}`}
                                    >
                                        <div className="flex items-center justify-between w-full">
                                            <span>{tier.tier} Tier</span>
                                            {tier.reqPremium && <span className="text-[7px] bg-red-500/20 text-red-400 px-1 rounded uppercase">Pro</span>}
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* STREAMING CHAT FLOW ELEMENT CONTAINER */}
                        <div className="flex-1 p-4 overflow-y-auto space-y-4 max-h-[350px] lg:max-h-full">
                            {chatHistory.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fadeIn`}>
                                    <div className={`max-w-[85%] rounded-xl p-3 text-xs leading-relaxed ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-950 text-slate-300 border border-slate-800 rounded-bl-none'}`}>
                                        {msg.text}
                                    </div>
                                </div>
                            ))}
                            {isCompiling && (
                                <div className="flex justify-start animate-pulse">
                                    <div className="bg-slate-950 text-slate-500 border border-slate-800 rounded-xl rounded-bl-none p-3 text-xs w-full">
                                        Connecting API endpoints... Requesting {currentModel.name} token allocation matrices...
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* AI TEXTING FIELD INTERFACE */}
                        <form onSubmit={executeTextingEngine} className="p-3 bg-slate-950/60 border-t border-slate-800">
                            <div className="flex gap-2">
                                <input 
                                    type="text" 
                                    value={promptInput}
                                    onChange={(e) => setPromptInput(e.target.value)}
                                    placeholder={`Message ${currentModel.tier} Tier Model... (e.g., Make the ball blue)`} 
                                    className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition"
                                />
                                <button type="submit" disabled={isCompiling} className="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg transition flex items-center justify-center">
                                    <Icon name="send" size={14} />
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* RIGHT SIDE PANEL: PREVIEW HUB & RAW SOURCE DISPLAY SYSTEM (7 COLS) */}
                    <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl flex flex-col justify-between overflow-hidden shadow-xl">
                        
                        {/* CONTROL BAR CONTROLS HEADER */}
                        <div className="p-3 bg-slate-950/60 border-b border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3 shrink-0">
                            <div className="flex items-center space-x-2 w-full sm:w-auto">
                                <input 
                                    type="text" 
                                    value={buildTitle} 
                                    onChange={(e) => setBuildTitle(e.target.value)}
                                    className="bg-slate-900 border border-slate-800 text-xs font-bold px-2.5 py-1.5 rounded text-white focus:outline-none focus:border-indigo-500 w-full sm:w-44" 
                                />
                                <div className="flex border border-slate-800 rounded overflow-hidden shrink-0 text-[10px] font-bold uppercase tracking-wider">
                                    <button onClick={() => setActiveTab('preview')} className={`px-2.5 py-1.5 transition ${activeTab === 'preview' ? 'bg-slate-800 text-white' : 'bg-slate-950 text-slate-400'}`}>
                                        HTML Preview
                                    </button>
                                    <button onClick={() => setActiveTab('source')} className={`px-2.5 py-1.5 transition ${activeTab === 'source' ? 'bg-slate-800 text-white' : 'bg-slate-950 text-slate-400'}`}>
                                        Source Viewer
                                    </button>
                                </div>
                            </div>

                            <button onClick={commitProjectPublish} className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-xs font-bold uppercase tracking-wider transition flex items-center justify-center gap-1 shadow-md">
                                <Icon name="plus" size={12} /> Publish Package
                            </button>
                        </div>

                        {/* DISPLAY ENGINE CORE ELEMENT INTERACTIVE WORKSPACE */}
                        <div className="flex-1 bg-slate-950 overflow-hidden relative min-h-[350px]">
                            {activeTab === 'preview' ? (
                                <iframe 
                                    ref={iframeRef} 
                                    title="HTML Preview Frame" 
                                    className="w-full h-full border-none bg-white"
                                />
                            ) : (
                                <textarea 
                                    value={htmlSource} 
                                    onChange={(e) => setHtmlSource(e.target.value)}
                                    className="w-full h-full bg-slate-950 text-slate-300 font-mono text-[11px] p-4 resize-none focus:outline-none border-none leading-relaxed" 
                                />
                            )}
                        </div>

                        {/* CONTROL LOG TERMINAL LAYER */}
                        <div className="bg-slate-950 px-4 py-1.5 border-t border-slate-800/80 flex items-center justify-between text-[9px] text-slate-500 font-mono shrink-0">
                            <span>Vercel Subpage Hub: /editor/workspace</span>
                            <span className="text-emerald-500 font-bold">● Live Compilation Pipeline Sync</span>
                        </div>
                    </div>

                </div>
            );
        }

        // Render Application context roots
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
